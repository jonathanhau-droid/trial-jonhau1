<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TripFlow 行程規劃</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-slate-50 relative shadow-2xl">

    <!-- 頂部標題列 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                <i class="fa-solid fa-plane-departure text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-tight" id="current-trip-title">載入中...</h1>
                <p class="text-xs text-slate-500" id="current-trip-dates">請選擇或新增行程</p>
            </div>
        </div>
        <button onclick="openTripModal()" class="text-slate-600 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1">
            <i class="fa-solid fa-suitcase"></i>
            <span>切換行程</span>
        </button>
    </header>

    <!-- 主要內容區 (可捲動) -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-24 px-4 pt-4">
        <!-- 動態載入分頁內容 -->
    </main>

    <!-- 底部導覽列 -->
    <nav class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 px-2 py-2 flex justify-around items-center z-20 shadow-lg">
        <button onclick="switchTab('itinerary')" id="nav-itinerary" class="flex flex-col items-center text-blue-600 transition flex-1 py-1">
            <i class="fa-solid fa-calendar-days text-xl mb-1"></i>
            <span class="text-[10px] font-medium">行程</span>
        </button>
        <button onclick="switchTab('checklist')" id="nav-checklist" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition flex-1 py-1">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-[10px] font-medium">清單</span>
        </button>
        <button onclick="switchTab('budget')" id="nav-budget" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition flex-1 py-1">
            <i class="fa-solid fa-wallet text-xl mb-1"></i>
            <span class="text-[10px] font-medium">預算</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition flex-1 py-1">
            <i class="fa-solid fa-gear text-xl mb-1"></i>
            <span class="text-[10px] font-medium">設定</span>
        </button>
    </nav>

    <!-- 行程管理 Modal -->
    <div id="trip-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800">我的行程列表</h3>
                <button onclick="closeTripModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto space-y-3 flex-1" id="trip-list-container">
                <!-- 動態生成行程清單 -->
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <button onclick="showNewTripForm()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>建立新行程</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 本地資料結構初始化
        let appData = JSON.parse(localStorage.getItem('tripflow_data')) || {
            currentTripId: 'trip_1',
            trips: [
                {
                    id: 'trip_1',
                    title: '東京 6 日遊',
                    dates: '2026-12-15 ~ 2026-12-20',
                    days: [
                        { date: '12月15日 (一)', items: [{ time: '10:00', title: '抵達成田機場', note: '搭乘 Skyliner', location: '成田機場' }] },
                        { date: '12月16日 (二)', items: [{ time: '09:00', title: '淺草寺參拜', note: '雷門拍照', location: '淺草寺' }] }
                    ],
                    checklist: [
                        { id: 1, text: '護照 (有效期6個月以上)', category: '證件', checked: true },
                        { id: 2, text: '日元現金 / 信用卡', category: '財務', checked: false }
                    ],
                    budget: [
                        { id: 1, title: '來回機票', amount: 4500, currency: 'HKD', category: '交通' },
                        { id: 2, title: '酒店住宿 (5晚)', amount: 6000, currency: 'HKD', category: '住宿' }
                    ]
                }
            ]
        };

        function saveData() {
            localStorage.setItem('tripflow_data', JSON.stringify(appData));
        }

        function getCurrentTrip() {
            return appData.trips.find(t => t.id === appData.currentTripId) || appData.trips[0];
        }

        let currentActiveTab = 'itinerary';

        function switchTab(tab) {
            currentActiveTab = tab;
            ['itinerary', 'checklist', 'budget', 'settings'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center text-blue-600 transition flex-1 py-1";
                } else {
                    btn.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 transition flex-1 py-1";
                }
            });
            renderContent();
        }

        function renderHeader() {
            const trip = getCurrentTrip();
            if (trip) {
                document.getElementById('current-trip-title').innerText = trip.title;
                document.getElementById('current-trip-dates').innerText = trip.dates;
            }
        }

        function renderContent() {
            renderHeader();
            const container = document.getElementById('main-content');
            const trip = getCurrentTrip();
            if (!trip) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400">沒有找到行程，請點擊右上角新增。</div>`;
                return;
            }

            if (currentActiveTab === 'itinerary') {
                let html = `<div class="space-y-4">`;
                trip.days.forEach((day, dayIndex) => {
                    html += `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                                    <span class="w-2 h-2 bg-blue-600 rounded-full"></span>
                                    <span>${day.date}</span>
                                </h3>
                                <button onclick="addActivity(${dayIndex})" class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-lg font-medium hover:bg-blue-100">
                                    <i class="fa-solid fa-plus mr-1"></i>新增行程
                                </button>
                            </div>
                            <div class="space-y-2">`;
                    if (day.items.length === 0) {
                        html += `<p class="text-xs text-slate-400 py-2 text-center">尚未新增活動</p>`;
                    } else {
                        day.items.forEach((item, itemIndex) => {
                            html += `
                                <div class="flex items-start space-x-3 p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                                    <span class="text-xs font-bold text-blue-600 mt-0.5">${item.time}</span>
                                    <div class="flex-1">
                                        <h4 class="text-xs font-bold text-slate-800">${item.title}</h4>
                                        ${item.location ? `<p class="text-[11px] text-slate-500"><i class="fa-solid fa-location-dot mr-1"></i>${item.location}</p>` : ''}
                                        ${item.note ? `<p class="text-[11px] text-slate-400 mt-0.5">${item.note}</p>` : ''}
                                    </div>
                                    <button onclick="deleteActivity(${dayIndex}, ${itemIndex})" class="text-slate-300 hover:text-red-500 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>`;
                        });
                    }
                    html += `</div></div>`;
                });
                html += `
                    <button onclick="addDay()" class="w-full py-3 border-2 border-dashed border-slate-200 text-slate-500 rounded-2xl text-xs font-medium hover:border-blue-400 hover:text-blue-600 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-calendar-plus"></i><span>新增一日行程</span>
                    </button>
                </div>`;
                container.innerHTML = html;
            } else if (currentActiveTab === 'checklist') {
                let html = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 text-sm">行李裝備清單</h3>
                            <button onclick="addChecklistItem()" class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg font-medium">新增物品</button>
                        </div>
                        <div class="space-y-2">`;
                trip.checklist.forEach((item, index) => {
                    html += `
                        <label class="flex items-center space-x-3 p-2.5 rounded-xl bg-slate-50 border border-slate-100 cursor-pointer">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklistItem(${index})" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <span class="text-xs flex-1 ${item.checked ? 'line-through text-slate-400' : 'text-slate-800'}">${item.text}</span>
                            <button onclick="deleteChecklistItem(${index})" class="text-slate-300 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </label>`;
                });
                html += `</div></div>`;
                container.innerHTML = html;
            } else if (currentActiveTab === 'budget') {
                let total = trip.budget.reduce((sum, item) => sum + Number(item.amount), 0);
                let html = `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-2xl shadow-lg">
                            <p class="text-xs text-blue-100 font-medium">預算總支出</p>
                            <h2 class="text-2xl font-bold mt-1">$${total.toLocaleString()} <span class="text-xs font-normal">HKD</span></h2>
                        </div>
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                            支出明細
                            <button onclick="addBudgetItem()" class="text-xs text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg font-medium">新增支出</button>
                        </div>
                        <div class="space-y-2">`;
                trip.budget.forEach((item, index) => {
                    html += `
                        <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100">
                            <div>
                                <h4 class="text-xs font-bold text-slate-800">${item.title}</h4>
                                <span class="text-[10px] text-slate-400">${item.category}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-bold text-slate-800">$${Number(item.amount).toLocaleString()}</span>
                                <button onclick="deleteBudgetItem(${index})" class="text-slate-300 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML = html;
            } else if (currentActiveTab === 'settings') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">App 設定與匯出</h3>
                        <p class="text-xs text-slate-500">所有資料均儲存在此 iPhone 的瀏覽器記憶體中。你可以隨時加到主畫面作為 PWA 使用。</p>
                        <button onclick="resetData()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 text-xs font-medium py-2.5 rounded-xl transition">重設所有資料</button>
                    </div>`;
            }
        }

        // 互動函數
        function openTripModal() {
            const container = document.getElementById('trip-list-container');
            container.innerHTML = appData.trips.map(t => `
                <div onclick="switchTrip('${t.id}')" class="p-3 rounded-xl border ${t.id === appData.currentTripId ? 'border-blue-600 bg-blue-50/50' : 'border-slate-100 bg-slate-50'} flex justify-between items-center cursor-pointer">
                    <div>
                        <h4 class="font-bold text-xs text-slate-800">${t.title}</h4>
                        <p class="text-[10px] text-slate-500">${t.dates}</p>
                    </div>
                    ${t.id === appData.currentTripId ? '<i class="fa-solid fa-check text-blue-600 text-xs"></i>' : ''}
                </div>
            `).join('');
            document.getElementById('trip-modal').classList.remove('hidden');
        }

        function closeTripModal() {
            document.getElementById('trip-modal').classList.add('hidden');
        }

        function switchTrip(id) {
            appData.currentTripId = id;
            saveData();
            closeTripModal();
            renderContent();
        }

        function showNewTripForm() {
            const title = prompt("請輸入新行程名稱（例如：北海道 5 日遊）：");
            if (!title) return;
            const newId = 'trip_' + Date.now();
            appData.trips.push({
                id: newId,
                title: title,
                dates: '2026-12-01 ~ 2026-12-06',
                days: [{ date: '第 1 天', items: [] }],
                checklist: [],
                budget: []
            });
            appData.currentTripId = newId;
            saveData();
            closeTripModal();
            renderContent();
        }

        function addActivity(dayIndex) {
            const title = prompt("輸入活動名稱：");
            if (!title) return;
            const time = prompt("輸入時間（例如 14:00）：") || "全日";
            const location = prompt("輸入地點（選填）：") || "";
            const trip = getCurrentTrip();
            trip.days[dayIndex].items.push({ time, title, location, note: "" });
            saveData();
            renderContent();
        }

        function deleteActivity(dayIndex, itemIndex) {
            const trip = getCurrentTrip();
            trip.days[dayIndex].items.splice(itemIndex, 1);
            saveData();
            renderContent();
        }

        function addDay() {
            const trip = getCurrentTrip();
            trip.days.push({ date: `第 ${trip.days.length + 1} 天`, items: [] });
            saveData();
            renderContent();
        }

        function toggleChecklistItem(index) {
            const trip = getCurrentTrip();
            trip.checklist[index].checked = !trip.checklist[index].checked;
            saveData();
        }

        function addChecklistItem() {
            const text = prompt("輸入裝備物品名稱：");
            if (!text) return;
            const trip = getCurrentTrip();
            trip.checklist.push({ id: Date.now(), text, category: '其他', checked: false });
            saveData();
            renderContent();
        }

        function deleteChecklistItem(index) {
            const trip = getCurrentTrip();
            trip.checklist.splice(index, 1);
            saveData();
            renderContent();
        }

        function addBudgetItem() {
            const title = prompt("輸入支出項目名稱：");
            if (!title) return;
            const amount = parseFloat(prompt("輸入金額 (HKD)：")) || 0;
            const trip = getCurrentTrip();
            trip.budget.push({ id: Date.now(), title, amount, category: '其他' });
            saveData();
            renderContent();
        }

        function deleteBudgetItem(index) {
            const trip = getCurrentTrip();
            trip.budget.splice(index, 1);
            saveData();
            renderContent();
        }

        function resetData() {
            if (confirm("確定要重設所有資料嗎？")) {
                localStorage.removeItem('tripflow_data');
                location.reload();
            }
        }

        // 初始化渲染
        renderContent();
    </script>
</body>
</html>
